name: Post Chiem Tinh Tai Chinh to Facebook

on:
  schedule:
    # 08:00 (Asia/Ho_Chi_Minh, UTC+7) Sunday = 01:00 UTC Sunday
    - cron: '0 1 * * 0'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node src/runChiemTinh.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          FB_GROUP_ACCESS_TOKEN: ${{ secrets.FB_GROUP_ACCESS_TOKEN }}
